<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>项目详情 · 汤</title>
<meta name="description" content="项目详情 —— 完整介绍、实现要点、技术栈与访问链接。">
<meta name="theme-color" content="#FAFAFA">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23165DFF%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%277%27%20fill%3D%27%23FFFFFF%27%2F%3E%3C%2Fsvg%3E">
<style>
/* ══════════════════════════════════════════════════════════════
   设计系统
   所有色值、圆角、阴影、间距一律走 CSS 变量，禁止零散写色。
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;

  /* —— 品牌色 —— */
  --c-primary:#165DFF;
  --c-primary-hover:#0E4AD8;
  --c-primary-soft:rgba(22,93,255,.08);
  --c-primary-line:rgba(22,93,255,.22);

  /* —— 中性色 —— */
  --c-bg:#FAFAFA;
  --c-surface:#FFFFFF;
  --c-text:#1D1D1F;
  --c-text-2:#86868B;
  --c-text-3:#AEAEB2;
  --c-line:rgba(29,29,31,.10);
  --c-line-soft:rgba(29,29,31,.06);
  --c-on-primary:#FFFFFF;   /* 主色之上的文字色 */
  /* 用于文字/图标的强调色：深色主题下要比填充色更亮才够对比 */
  --c-accent:#165DFF;
  --c-surface-2:#F4F4F6;

  /* —— 以下全部为「可被深色主题覆盖」的衍生色 —— */
  /* 背景三层色温：右上冷蓝 → 左上极淡暖橙 → 底部冷蓝回升。
     暖色只有 3% 量级，作用是「色温对比」而不是「看到橙色」。 */
  --c-body-glow-1:rgba(22,93,255,.075);
  --c-body-glow-2:rgba(198,118,72,.032);
  --c-body-glow-3:rgba(22,93,255,.05);
  --c-body-veil:rgba(255,255,255,.55);
  --c-grain-opacity:.045;
  --c-nav-bg:rgba(250,250,250,.72);
  --c-nav-bg-solid:rgba(250,250,250,.96);
  --c-hairline:rgba(29,29,31,.02);
  --c-hover:rgba(29,29,31,.035);
  --c-pulse:rgba(22,93,255,.34);
  --c-pulse-fade:rgba(22,93,255,0);
  --c-btn-shadow:rgba(22,93,255,.12);
  --c-btn-shadow-hover:rgba(22,93,255,.22);
  --c-badge-bg:rgba(255,255,255,.86);
  --c-cover-filter:none;
  /* hover 专用：阴影比常规更深一档，边框明显但不用主色（避免廉价） */
  --sh-hover:0 4px 10px rgba(29,29,31,.06), 0 22px 48px rgba(29,29,31,.11);
  --c-line-hover:rgba(29,29,31,.18);
  --c-cover-filter-hover:brightness(1.04) saturate(1.04);

  /* —— 阴影：低透明度、柔和，拒绝厚重黑影 —— */
  --sh-1:0 1px 2px rgba(29,29,31,.04), 0 4px 14px rgba(29,29,31,.045);
  --sh-2:0 2px 6px rgba(29,29,31,.05), 0 14px 40px rgba(29,29,31,.075);
  --sh-3:0 8px 24px rgba(29,29,31,.09), 0 32px 72px rgba(29,29,31,.13);

  /* —— 圆角：统一 12px —— */
  --r-sm:8px;
  --r:12px;
  --r-lg:20px;
  --r-pill:999px;

  /* —— 字体：标题与正文都以苹方（PingFang SC）优先，标题用粗体 ——
     PingFang SC 是 macOS / iOS 的系统字体，Apple 设备上就是原生苹方粗体。
     Windows 上没有苹方，按下面的顺序回退到视觉最接近的现代几何黑体：
       Noto Sans SC（思源黑体，Bold 字重齐全，和苹方同属无衬线几何结构）
       → HarmonyOS Sans SC（鸿蒙黑体，形态接近）
       → Microsoft YaHei（雅黑，最后兜底）
     字重统一在 h1–h4 上写 700，即苹方的 Bold。 */
  --font-display:"PingFang SC","PingFang HK","Noto Sans SC",
                 "HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --font-body:"PingFang SC","PingFang HK","Noto Sans SC",
              "HarmonyOS Sans SC","Microsoft YaHei",
              -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;

  /* —— 字号阶梯：层级严格区分 —— */
  --fs-xs:.75rem;      /* 12 */
  --fs-sm:.8125rem;    /* 13 */
  --fs-base:.9375rem;  /* 15 */
  --fs-md:1.0625rem;   /* 17 */
  --fs-lg:1.25rem;     /* 20 */
  --fs-xl:1.75rem;     /* 28 */
  --fs-2xl:2.5rem;     /* 40 */
  --fs-3xl:clamp(2.6rem,5.6vw,4.25rem); /* 42–68 */

  /* —— 间距 —— */
  --sp-1:.5rem; --sp-2:1rem; --sp-3:1.5rem; --sp-4:2rem;
  --sp-5:3rem; --sp-6:4rem; --sp-7:6rem; --sp-8:8rem;

  --gutter:1.5rem;
  --maxw:1240px;
  --nav-h:64px;

  /* —— 动效 —— */
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  /* 全局缓动：easeOutQuad。
     实测各段增量 0.19→0.18→0.16→0.13→0.11→0.08→0.05，均匀递减；
     而 .22,.61,.36,1 是 0.27→0.23→0.17，前 20% 就走完一半，观感「猛一下」。
     位移类动效统一用它。 */
  --ease-soft:cubic-bezier(.25,.46,.45,.94);
  --ease-reveal:var(--ease-soft);
  --t-reveal:.8s;
  --t-fast:.22s;
  --t-mid:.42s;
  --t-slow:.66s;
}

/* ══════════════════════════════════════════════════════════════
   深色主题
   只覆盖变量，不改任何组件规则 —— 所有颜色都从 :root 派生，
   所以一处覆盖全站生效。主色拆成两个角色：
     --c-primary  填充色（按钮底色），配白字，对比度 6.3:1
     --c-accent   文字/图标强调色，深底上要更亮才够对比
   ══════════════════════════════════════════════════════════════ */
html[data-theme="dark"]{
  color-scheme:dark;

  --c-bg:#0C0C0E;
  --c-surface:#16161A;
  --c-surface-2:#1E1E23;
  --c-text:#F4F4F6;
  --c-text-2:#9C9CA5;
  --c-text-3:#6B6B75;
  --c-line:rgba(255,255,255,.14);
  --c-line-soft:rgba(255,255,255,.075);

  --c-primary:#165DFF;
  --c-primary-hover:#2A6BFF;
  --c-accent:#8AB4FF;
  --c-primary-soft:rgba(76,141,255,.16);
  --c-primary-line:rgba(76,141,255,.34);
  --c-on-primary:#FFFFFF;

  /* 深色下阴影几乎不可见：加大不透明度，并让边框承担分隔职责 */
  --sh-1:0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
  --sh-2:0 2px 6px rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.45);
  --sh-3:0 8px 24px rgba(0,0,0,.6), 0 32px 72px rgba(0,0,0,.55);

  --c-body-glow-1:rgba(76,141,255,.115);
  --c-body-glow-2:rgba(44,96,168,.075);
  --c-body-glow-3:rgba(76,141,255,.07);
  --c-body-veil:rgba(120,160,255,.035);
  --c-grain-opacity:.055;
  --c-nav-bg:rgba(12,12,14,.72);
  --c-nav-bg-solid:rgba(12,12,14,.97);
  --c-hairline:rgba(255,255,255,.035);
  --c-hover:rgba(255,255,255,.06);
  --c-pulse:rgba(76,141,255,.5);
  --c-pulse-fade:rgba(76,141,255,0);
  --c-btn-shadow:rgba(22,93,255,.32);
  --c-btn-shadow-hover:rgba(22,93,255,.45);
  --c-badge-bg:rgba(22,22,26,.82);
  /* 封面是浅色底，深色页面上轻压一档：融入但不影响辨识 */
  --c-cover-filter:brightness(.9) contrast(1.03) saturate(1.06);
  --sh-hover:0 4px 12px rgba(0,0,0,.5), 0 26px 56px rgba(0,0,0,.6);
  --c-line-hover:rgba(255,255,255,.22);
  --c-cover-filter-hover:brightness(.98) saturate(1.1);
}

/* 切主题时大面积色块渐变过渡，硬切会闪眼；
   不加在文字本身上，避免字重发虚 */
body,.nav,.card,.tool,.social,.skill-tag,.tech,.filter,.contact__note,
.detail__link,.about__media,.detail__hero,.footer,.card__badge,
.nav__menu,.nav__link,.ct-direct{
  transition:background-color .32s var(--ease),border-color .32s var(--ease),
             color .32s var(--ease);
}

/* ══════════ 基础 ══════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font-body);
  font-size:var(--fs-base);
  line-height:1.7;
  color:var(--c-text);
  background:var(--c-bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
/* 极淡径向渐变：营造空间深度，肉眼几乎不可见 */
/* 背景分两层：
   ::before —— 大半径色温渐变，制造空间深度（不是光斑，没有明确边界）
   ::after  —— 极细噪点，消除纯色的「塑料感」；固定不随滚动，像胶片颗粒 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 640px at 84% -8%,var(--c-body-glow-1),transparent 58%),
    radial-gradient(820px 560px at -6% 16%,var(--c-body-glow-2),transparent 56%),
    radial-gradient(980px 660px at 46% 112%,var(--c-body-glow-3),transparent 60%),
    linear-gradient(178deg,var(--c-body-veil) 0%,transparent 32%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27160%27%20height%3D%27160%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.86%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27160%27%20height%3D%27160%27%20filter%3D%27url%28%23n%29%27%2F%3E%3C%2Fsvg%3E");
  background-repeat:repeat;
  background-size:160px 160px;
  opacity:var(--c-grain-opacity);
  /* soft-light 让颗粒只在高光与暗部起作用，中间调几乎不动 —— 不会显脏 */
  mix-blend-mode:soft-light;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  margin:0;
  font-weight:700;          /* 苹方 Bold */
  line-height:1.16;
  letter-spacing:-.03em;    /* 粗体字面偏宽，收紧一点才不散 */
  color:var(--c-text);
}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--c-primary);outline-offset:3px;border-radius:4px}
::selection{background:var(--c-primary);color:var(--c-on-primary)}

.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.skip{
  position:fixed;left:var(--sp-3);top:-80px;z-index:200;
  padding:.65rem 1.1rem;border-radius:var(--r-sm);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:600;font-size:var(--fs-sm);
  transition:top .2s var(--ease);
}
.skip:focus{top:var(--sp-3)}

/* ══════════ 1. 固定导航栏 ══════════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--nav-h);
  display:flex;align-items:center;
  background:transparent;
  border-bottom:1px solid transparent;
  transition:background .4s var(--ease),border-color .4s var(--ease),
             backdrop-filter .4s var(--ease),box-shadow .4s var(--ease);
}
.nav.is-stuck{
  background:var(--c-nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom-color:var(--c-line-soft);
  box-shadow:0 1px 0 var(--c-hairline);
}
.nav__inner{display:flex;align-items:center;justify-content:space-between;width:100%}
.brand{
  display:flex;align-items:center;gap:.6rem;
  font-family:var(--font-display);font-size:1.0625rem;font-weight:700;
  letter-spacing:-.02em;color:var(--c-text);
}
.brand__dot{
  width:7px;height:7px;border-radius:50%;background:var(--c-primary);
  transition:transform .4s var(--ease-out);
}
.brand:hover .brand__dot{transform:scale(1.6)}
.nav__menu{display:flex;align-items:center;gap:.35rem}
.nav__link{
  position:relative;padding:.5rem .8rem;
  /* 底部两角保持直角：否则 border-bottom 会沿着圆角向上弯成 U 形 */
  border-radius:var(--r-sm) var(--r-sm) 0 0;
  font-size:var(--fs-sm);font-weight:500;color:var(--c-text-2);
  transition:color .24s var(--ease),background .24s var(--ease),
             border-color .24s var(--ease);
  border-bottom:2px solid transparent;   /* 预留位置，避免 active 时高度跳 2px */
}
.nav__link:hover{color:var(--c-text);background:var(--c-hover)}
.nav__link.is-active{
  color:var(--c-text);
  /* 指示线用 border-bottom：不要用 background + calc(background-size) ——
     calc 一旦失效，渐变会铺满整个链接，再被 nav 的 backdrop-filter 糊成一团蓝块。
     也不用 ::after，同样会被那个模糊层污染。 */
  border-bottom-color:var(--c-primary);
}
/* 导航右侧：菜单 + 主题切换 + 汉堡 */
.nav__right{display:flex;align-items:center;gap:.55rem}

.theme{
  width:36px;height:36px;flex:none;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid var(--c-line-soft);
  color:var(--c-text-2);background:transparent;
  transition:color .24s var(--ease),border-color .24s var(--ease),
             background .24s var(--ease),transform .24s var(--ease-out);
}
.theme:hover{color:var(--c-text);border-color:var(--c-line);background:var(--c-hover)}
.theme:active{transform:scale(.94)}
.theme svg{width:17px;height:17px}
/* 浅色下显示月亮（点了变深），深色下显示太阳 */
html:not([data-theme="dark"]) .theme__sun{display:none}
html[data-theme="dark"] .theme__moon{display:none}

.nav__toggle{
  display:none;width:40px;height:40px;border-radius:var(--r-sm);
  align-items:center;justify-content:center;flex-direction:column;gap:5px;
}
.nav__toggle span{
  display:block;width:19px;height:1.5px;border-radius:2px;background:var(--c-text);
  transition:transform .3s var(--ease),opacity .2s var(--ease);
}
.nav__toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav__toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
.nav__toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

/* ══════════ 通用：板块标题 ══════════ */
.section{padding:var(--sp-8) 0;position:relative}
.section__head{margin-bottom:var(--sp-5);max-width:44rem}
.eyebrow{
  display:inline-flex;align-items:center;gap:.55rem;
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.18em;text-transform:uppercase;color:var(--c-accent);
  margin-bottom:var(--sp-2);
}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.55}
.section__title{font-size:var(--fs-2xl)}
.section__desc{margin-top:var(--sp-3);color:var(--c-text-2);font-size:var(--fs-md);line-height:1.75}
.section__num{
  font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-text-3);
  letter-spacing:.1em;
}

/* ══════════ 2. Hero ══════════ */
.hero{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--sp-4);
  align-items:end;
  padding-top:calc(var(--nav-h) + var(--sp-8));
  padding-bottom:var(--sp-7);
  min-height:calc(100vh - var(--nav-h));
  min-height:calc(100svh - var(--nav-h));
}
.hero__left{grid-column:1/8}
.hero__right{grid-column:9/13;padding-top:var(--sp-6);display:flex;flex-direction:column;justify-content:flex-end;gap:var(--sp-4)}
.hero__eyebrow{
  display:inline-flex;align-items:center;gap:.6rem;
  padding:.34rem .8rem;border-radius:var(--r-pill);
  background:var(--c-primary-soft);border:1px solid var(--c-primary-line);
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);
  margin-bottom:var(--sp-3);
}
.hero__eyebrow i{
  width:6px;height:6px;border-radius:50%;background:var(--c-primary);
  animation:pulse 2.4s var(--ease) infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 var(--c-pulse)}
  50%{box-shadow:0 0 0 7px var(--c-pulse-fade)}
}
.hero__title{font-size:var(--fs-3xl);letter-spacing:-.035em}
.hero__title em{font-style:normal;color:var(--c-accent)}
.hero__role{
  margin-top:var(--sp-3);font-size:var(--fs-lg);
  color:var(--c-text);font-weight:500;letter-spacing:-.01em;
}
.hero__desc{
  margin-top:var(--sp-3);font-size:var(--fs-md);color:var(--c-text-2);
  max-width:34rem;line-height:1.8;
}
.hero__cta{display:flex;flex-wrap:wrap;gap:.85rem;justify-content:flex-end}
.hero__stats{
  grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--sp-5);
  margin-top:var(--sp-6);padding-top:var(--sp-4);
  border-top:1px solid var(--c-line-soft);
}
.hero__stat{display:grid;gap:.1rem}
.hero__stat b{
  font-family:var(--font-display);font-size:var(--fs-xl);
  font-weight:700;letter-spacing:-.025em;
}
.hero__stat span{font-size:var(--fs-xs);color:var(--c-text-2);letter-spacing:.02em}

/* Hero 右侧：一条当前动态，克制的小段落 */
.hero__note{
  padding:var(--sp-3) 0 var(--sp-3) var(--sp-3);
  border-left:2px solid var(--c-primary-line);
}
.hero__note-label{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-3);
  margin-bottom:.7rem;
}
.hero__note-text{font-size:var(--fs-base);color:var(--c-text);line-height:1.75}
.hero__note-meta{
  margin-top:.8rem;font-family:var(--font-mono);font-size:var(--fs-xs);
  color:var(--c-accent);letter-spacing:.04em;
}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;gap:.55rem;
  padding:.82rem 1.5rem;border-radius:var(--r-pill);
  font-size:var(--fs-base);font-weight:600;letter-spacing:-.005em;
  transition:transform .3s var(--ease-out),box-shadow .3s var(--ease),
             background .3s var(--ease),border-color .3s var(--ease);
}
.btn--primary{background:var(--c-primary);color:var(--c-on-primary);box-shadow:0 1px 5px var(--c-btn-shadow)}
.btn--primary:hover{background:var(--c-primary-hover);transform:translateY(-2px);box-shadow:0 6px 20px var(--c-btn-shadow-hover)}
.btn--ghost{border:1px solid var(--c-line);color:var(--c-text);background:var(--c-surface)}
.btn--ghost:hover{border-color:var(--c-primary);color:var(--c-accent);transform:translateY(-2px)}
.btn svg{transition:transform .3s var(--ease-out)}
.btn:hover svg{transform:translateX(3px)}

/* ══════════ 3. 作品画廊（Bento 错落网格）══════════ */
.gallery{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--sp-4);
  /* 底部对齐：同一行内矮卡自然落在下方，行底齐平、顶边锯齿 —— 错落感来自宽度差，
     且不用硬编码 margin-top，body 高度变化也不会错位。 */
  align-items:end;
}
.card{
  position:relative;display:flex;flex-direction:column;
  background:var(--c-surface);
  border:1px solid var(--c-line-soft);
  border-radius:var(--r);
  overflow:hidden;cursor:pointer;
  text-align:left;width:100%;
  transition:transform .55s var(--ease-soft),box-shadow .55s var(--ease-soft),
             border-color .32s var(--ease-soft);
  will-change:transform;
}
/* hover：浮起 8px（原来 4px 太含蓄）+ 阴影加重 + 边框提亮 */
.card:hover{
  transform:translateY(-8px);
  box-shadow:var(--sh-hover);
  border-color:var(--c-line-hover);
}
.card:focus-visible{outline:2px solid var(--c-primary);outline-offset:3px}
.card__media{
  position:relative;aspect-ratio:4/3;overflow:hidden;
  flex:0 0 auto;   /* 关键：不收缩，保证 4:3 真实生效 */
  background:var(--c-surface);
  border-bottom:1px solid var(--c-line-soft);
}
.card__media img{
  width:100%;height:100%;object-fit:cover;
  filter:var(--c-cover-filter);
  /* 1.2s + easeOutQuad：位移均匀减速，不会「猛一下放大再卡住」。
     缩放幅度压到 1.035 —— 1.06 在 690px 宽封面上等于 41px 位移，太窜。 */
  transition:transform 1.2s var(--ease-soft),filter .55s var(--ease-soft);
  will-change:transform;
}
.card:hover .card__media img{
  transform:scale(1.035);
  filter:var(--c-cover-filter-hover);
}
.card__badge{
  position:absolute;top:.85rem;left:.85rem;
  padding:.24rem .6rem;border-radius:var(--r-pill);
  background:var(--c-badge-bg);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--c-line-soft);
  font-family:var(--font-mono);font-size:var(--fs-xs);
  color:var(--c-text-2);letter-spacing:.06em;
}
.card__body{padding:1.15rem 1.25rem 1.3rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.card__title{font-size:var(--fs-lg);letter-spacing:-.018em}
.card__cat{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.12em;text-transform:uppercase;color:var(--c-accent);
}
.card__desc{font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.65}
.card__foot{
  margin-top:auto;padding-top:.85rem;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  font-size:var(--fs-xs);color:var(--c-text-3);
}
.card__more{
  display:inline-flex;align-items:center;gap:.3rem;
  color:var(--c-text-2);font-weight:600;
  transition:color .26s var(--ease),gap .26s var(--ease);
}
.card:hover .card__more{color:var(--c-accent);gap:.55rem}

/* Bento 桌面规则见文件末尾 @media (min-width:1024px) */


/* ══════════ 5. 技能与工具 ══════════ */
.skills{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-6);align-items:start}
.skill-group{margin-bottom:var(--sp-4)}
.skill-group:last-child{margin-bottom:0}
.skill-group__name{
  font-size:var(--fs-sm);font-weight:600;color:var(--c-text);
  margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem;
}
.skill-group__name::before{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--c-primary);
}
.skill-tags{display:flex;flex-wrap:wrap;gap:.5rem}
.skill-tag{
  padding:.38rem .85rem;border-radius:var(--r-pill);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);color:var(--c-text);
  transition:border-color .26s var(--ease),color .26s var(--ease),
             transform .26s var(--ease-out);
}
.skill-tag:hover{border-color:var(--c-primary-line);color:var(--c-accent);transform:translateY(-2px)}
.tools{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:.75rem;
}
.tool{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  padding:1.05rem .5rem;border-radius:var(--r);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  color:var(--c-text-2);
  transition:border-color .26s var(--ease),color .26s var(--ease),
             transform .26s var(--ease-out),box-shadow .26s var(--ease);
}
.tool:hover{
  border-color:var(--c-primary-line);color:var(--c-accent);
  transform:translateY(-3px);box-shadow:var(--sh-1);
}
.tool svg{width:24px;height:24px}
.tool span{font-size:var(--fs-xs);letter-spacing:.01em}

/* ══════════ 6. 关于我 ══════════ */
.about{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--sp-6);align-items:center}
.about__text p{color:var(--c-text-2);font-size:var(--fs-md);line-height:1.85}
.about__text p + p{margin-top:var(--sp-3)}
.about__text strong{color:var(--c-text);font-weight:600}
.about__quote{
  margin-top:var(--sp-4);padding-left:var(--sp-3);
  border-left:2px solid var(--c-primary);
  font-family:var(--font-display);font-size:var(--fs-lg);
  line-height:1.55;letter-spacing:-.015em;color:var(--c-text);
}
.about__facts{
  margin-top:var(--sp-4);display:grid;gap:0;
  border-top:1px solid var(--c-line-soft);
}
.about__fact{
  display:flex;justify-content:space-between;gap:var(--sp-3);
  padding:.85rem 0;border-bottom:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);
}
.about__fact dt{color:var(--c-text-2)}
.about__fact dd{margin:0;font-weight:600;text-align:right}
.about__media{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  aspect-ratio:4/5;background:var(--c-surface);
  border:1px solid var(--c-line-soft);box-shadow:var(--sh-1);
}
.about__media img{width:100%;height:100%;object-fit:cover}

/* ══════════ 7. 联系 ══════════ */
.contact{
  display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-6);
  align-items:center;
}
.contact__lead{font-size:var(--fs-2xl);letter-spacing:-.03em;line-height:1.2}
.contact__mail{
  display:inline-flex;align-items:center;gap:.6rem;margin-top:var(--sp-4);
  font-family:var(--font-display);font-size:var(--fs-lg);font-weight:600;
  letter-spacing:-.02em;
  border-bottom:1.5px solid var(--c-primary-line);
  padding-bottom:.2rem;
  transition:border-color .28s var(--ease),color .28s var(--ease);
}
.contact__mail:hover{color:var(--c-accent);border-color:var(--c-primary)}
.socials{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:var(--sp-5)}
.social{
  display:inline-flex;align-items:center;gap:.55rem;
  padding:.6rem 1.05rem;border-radius:var(--r-pill);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);font-weight:500;color:var(--c-text);
  transition:all .26s var(--ease);
}
.social:hover{
  border-color:var(--c-primary);color:var(--c-accent);
  transform:translateY(-2px);box-shadow:var(--sh-1);
}
.social svg{width:17px;height:17px;flex:none}

/* 联系区右栏：合作方式清单 */
.contact__note{
  padding:var(--sp-4);border-radius:var(--r);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
}
.contact__note-label{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-3);
  margin-bottom:1rem;
}
.contact__note-list{display:grid;gap:.85rem}
.contact__note-list li{
  position:relative;padding-left:1.15rem;
  font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.6;
}
.contact__note-list li::before{
  content:"";position:absolute;left:0;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--c-primary);opacity:.65;
}

/* ══════════ 8. 页脚 ══════════ */
.footer{
  border-top:1px solid var(--c-line-soft);
  padding:var(--sp-4) 0;
}
.footer__inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-3);flex-wrap:wrap;
  font-size:var(--fs-sm);color:var(--c-text-2);
}
.footer__links{display:flex;gap:var(--sp-3);flex-wrap:wrap}
.footer__links a{transition:color .24s var(--ease)}
.footer__links a:hover{color:var(--c-accent)}

/* ══════════ 滚动入场动效（全局唯一一套）══════════
   用 animation 而不是 transition：
   .reveal 与 .card 特异性相同，若用 transition 会覆盖卡片的 hover 过渡，
   导致上浮被加上 90ms 延迟、耗时 620ms。animation 不占用 transition 属性。
   填充模式用 `backwards`（不是 both）：
   both 会在动画结束后继续锁住 transform，把卡片 hover 的上浮吃掉；
   backwards 只保证 delay 期间停在起始帧，播完就把 transform 交还给普通样式。 */
.reveal{opacity:0}
.reveal.is-in{
  opacity:1;                       /* 动画结束后靠它保持可见 */
  animation:revealIn var(--t-reveal) var(--ease-reveal) var(--delay,0ms) backwards;
}
@keyframes revealIn{
  from{
    opacity:0;
    /* translate3d 直接走合成层，比 translateY 更稳 */
    transform:translate3d(0,var(--reveal-y,24px),0) scale(var(--reveal-s,.99));
  }
  to{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
  }
}

/* 位移量按元素「重量」分级：字号越大动得越多，小标签几乎只是淡入。
   全场同幅度平移会显得平，分级后才有层次。 */
.hero__title.reveal{--reveal-y:26px;--reveal-s:.99}
.section__title.reveal,
.contact__lead.reveal,
.detail__title.reveal{--reveal-y:24px;--reveal-s:.99}
.hero__role.reveal,
.hero__desc.reveal,
.section__desc.reveal{--reveal-y:16px;--reveal-s:1}
.hero__eyebrow.reveal,
.eyebrow.reveal{--reveal-y:8px;--reveal-s:1}
.card.reveal{--reveal-y:18px;--reveal-s:.994}
.hero__stats.reveal{--reveal-y:12px;--reveal-s:1}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .reveal{opacity:1;transform:none}
}

/* ══════════ 响应式：375 / 768 / 1200 ══════════ */
@media (max-width:1199px){
  :root{--sp-8:6.5rem}
  .hero__left{grid-column:1/9}
  .hero__right{grid-column:9/13;padding-top:var(--sp-5)}
}
/* 1023 以下：Hero 改为上下堆叠，主按钮回到内容流中 */
@media (max-width:1023px){
  .hero{grid-template-columns:1fr;min-height:auto;gap:var(--sp-4)}
  .hero__left,.hero__right{grid-column:1/-1}
  .hero__right{padding-top:0;justify-content:flex-start}
  .hero__cta{justify-content:flex-start}
}
@media (max-width:1023px){
  .skills{grid-template-columns:1fr;gap:var(--sp-5)}
  .about{grid-template-columns:1fr;gap:var(--sp-5)}
  .about__media{max-width:420px;aspect-ratio:16/11}
  .contact{grid-template-columns:1fr;gap:var(--sp-4)}
}
/* 768–1023 平板档：画廊两列，导航仍用桌面菜单（够宽） */
@media (max-width:1023px) and (min-width:768px){
  .gallery{grid-template-columns:repeat(6,1fr)}
  .gallery .card:nth-child(n){grid-column:span 3;margin-top:0}
  .gallery .card:nth-child(4n+1){grid-column:span 4}
  .gallery .card:nth-child(4n+4){grid-column:span 2}
}
@media (max-width:767px){
  :root{
    --gutter:1.25rem;--sp-7:4.5rem;--sp-8:4.5rem;
    --fs-2xl:2rem;--fs-xl:1.5rem;--fs-3xl:clamp(2.15rem,9vw,3rem);
  }
  .nav__toggle{display:flex}
  .theme{width:34px;height:34px}
  .theme svg{width:16px;height:16px}
  .nav__menu{
    position:absolute;top:var(--nav-h);left:0;right:0;
    flex-direction:column;align-items:stretch;gap:.1rem;
    padding:var(--sp-2) var(--gutter) var(--sp-3);
    background:var(--c-nav-bg-solid);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-bottom:1px solid var(--c-line-soft);
    opacity:0;visibility:hidden;transform:translateY(-6px);
    transition:opacity .28s var(--ease),transform .28s var(--ease),visibility .28s var(--ease);
  }
  .nav__menu.is-open{opacity:1;visibility:visible;transform:none}
  .nav__link{padding:.65rem .5rem;font-size:var(--fs-base)}
  .nav__link.is-active{border-bottom-width:2px}

  /* Hero：竖排，主按钮移到左下区域 */
  .hero{
    grid-template-columns:1fr;
    min-height:auto;
    padding-top:calc(var(--nav-h) + var(--sp-6));
    padding-bottom:var(--sp-6);
    gap:var(--sp-4);
  }
  .hero__left,.hero__right{grid-column:1/-1}
  .hero__right{padding-top:0;justify-content:flex-start}
  .hero__cta{justify-content:flex-start}
  .hero__stats{
    display:grid;grid-template-columns:1fr 1fr;
    gap:var(--sp-3) var(--sp-3);
    margin-top:var(--sp-4);padding-top:var(--sp-3);
  }
  .hero__stat b{font-size:var(--fs-lg)}

  /* 画廊：单列堆叠 */
  .gallery{grid-template-columns:1fr;gap:var(--sp-3)}
  .gallery .card:nth-child(n){grid-column:1/-1;margin-top:0}


  .section__desc{font-size:var(--fs-base)}
  .tools{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
}
@media (max-width:374px){
  :root{--gutter:1rem}
  .hero__cta{flex-direction:column;align-items:stretch}
  .hero__cta .btn{justify-content:center}
  .tools{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1200px){
  /* 跨度不变，错落靠 align-items:end，无需额外偏移 */
}

/* ══════════ 作品筛选条 ══════════ */
.filters{
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
  margin-bottom:var(--sp-4);
  padding-bottom:var(--sp-3);
  border-bottom:1px solid var(--c-line-soft);
}
.filter{
  padding:.42rem 1rem;border-radius:var(--r-pill);
  background:transparent;border:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);font-weight:500;color:var(--c-text-2);
  transition:all .26s var(--ease);
}
.filter:hover{color:var(--c-text);border-color:var(--c-line)}
.filter.is-active{
  background:var(--c-primary);border-color:var(--c-primary);
  color:var(--c-on-primary);font-weight:600;
}
.filter__count{
  margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-xs);
  color:var(--c-text-3);letter-spacing:.04em;
}
.card.is-hidden{display:none}

/* 19 张卡片的 Bento 节奏：每 6 张一个循环，跨度 7/5 交替 + 垂直偏移。
   必须限定 min-width:1024 —— 否则这段写在响应式之后，会覆盖掉移动端单列。 */
@media (min-width:1024px){
  /* 每 6 张一循环，跨度 7/5 与 5/7 交替。
     不再用 margin-top 做偏移（负值会重叠、正值依赖硬编码高度）：
     统一由 align-items:end 让行底齐平，错落来自宽度差。 */
  .gallery .card:nth-child(6n+1){grid-column:span 7}
  .gallery .card:nth-child(6n+2){grid-column:span 5}
  .gallery .card:nth-child(6n+3){grid-column:span 5}
  .gallery .card:nth-child(6n+4){grid-column:span 7}
  .gallery .card:nth-child(6n+5){grid-column:span 7}
  .gallery .card:nth-child(6n+6){grid-column:span 5}
}

/* ══════════ 二级详情页 ══════════ */
.detail{padding-top:calc(var(--nav-h) + var(--sp-6));padding-bottom:var(--sp-7)}
.back{
  display:inline-flex;align-items:center;gap:.45rem;
  font-size:var(--fs-sm);font-weight:600;color:var(--c-text-2);
  transition:color .24s var(--ease),gap .24s var(--ease);
}
.back:hover{color:var(--c-accent);gap:.7rem}
.detail__head{

}
.detail__cat{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.14em;text-transform:uppercase;color:var(--c-accent);
}
.detail__title{margin-top:.6rem;font-size:var(--fs-3xl);letter-spacing:-.035em}
.detail__repo{
  font-family:var(--font-mono);font-size:var(--fs-sm);
  color:var(--c-text-3);margin-top:.7rem;
}
.detail__lead{font-size:var(--fs-md);color:var(--c-text-2);line-height:1.85}
.detail__hero{
  aspect-ratio:16/9;overflow:hidden;border-radius:var(--r-lg);
  border:1px solid var(--c-line-soft);background:var(--c-surface);
  box-shadow:var(--sh-1);
}
.detail__hero img{width:100%;height:100%;object-fit:cover;filter:var(--c-cover-filter)}
.detail__grid{
  display:grid;grid-template-columns:1.2fr .8fr;gap:var(--sp-6);
  margin-top:var(--sp-6);align-items:start;
}
.detail__label{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-3);
  margin-bottom:var(--sp-2);
}
.detail__desc{font-size:var(--fs-md);color:var(--c-text-2);line-height:1.9}
.points{display:grid;gap:.9rem;margin-top:var(--sp-4)}
.points li{
  position:relative;padding-left:1.35rem;
  font-size:var(--fs-base);color:var(--c-text-2);line-height:1.7;
}
.points li::before{
  content:"";position:absolute;left:0;top:.68em;
  width:6px;height:6px;border-radius:50%;background:var(--c-primary);opacity:.7;
}
.side{display:grid;gap:var(--sp-5)}
.techs{display:flex;flex-wrap:wrap;gap:.5rem}
.tech{
  padding:.38rem .85rem;border-radius:var(--r-pill);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);color:var(--c-text);
}
.detail__links{display:grid;gap:.6rem}
.detail__link{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  padding:.9rem 1.1rem;border-radius:var(--r);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);font-weight:600;
  transition:all .26s var(--ease);
}
.detail__link:hover{
  border-color:var(--c-primary);color:var(--c-accent);
  transform:translateY(-2px);box-shadow:var(--sh-1);
}
.detail__link--primary{background:var(--c-primary);border-color:var(--c-primary);color:var(--c-on-primary)}
.detail__link--primary:hover{background:var(--c-primary-hover);color:var(--c-on-primary)}
.detail__nav{
  display:flex;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;
  margin-top:var(--sp-6);padding-top:var(--sp-4);
  border-top:1px solid var(--c-line-soft);
}
.detail__nav a{
  display:grid;gap:.25rem;font-size:var(--fs-sm);color:var(--c-text-2);
  transition:color .24s var(--ease);
}
.detail__nav a:hover{color:var(--c-accent)}

<script>
/**
 * 主题切换：浅色 / 深色。
 *
 * 这段脚本会被 build.py 内联进两个 HTML 的 <head>，**必须同步、阻塞执行** ——
 * 否则页面会先按浅色画一帧再跳成深色（白闪）。
 *
 * 优先级：localStorage 里用户手动选过的 > 系统偏好（prefers-color-scheme）。
 * 用户没手动选过时，系统切换深浅主题会实时跟随。
 */
(function () {
  "use strict";

  var KEY = "theme";                 // "light" | "dark" | 不存在（跟随系统）
  var root = document.documentElement;
  var mq = window.matchMedia("(prefers-color-scheme: dark)");

  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function apply(mode, persist) {
    root.setAttribute("data-theme", mode);
    root.style.colorScheme = mode;
    // 移动端地址栏 / 状态栏跟着变
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", mode === "dark" ? "#0C0C0E" : "#FAFAFA");
    if (persist) {
      try { localStorage.setItem(KEY, mode); } catch (e) {}
    }
  }

  /* —— 立即执行：首帧之前就把主题定下来 —— */
  var saved = stored();
  var initial = saved === "dark" || saved === "light"
    ? saved
    : (mq.matches ? "dark" : "light");
  apply(initial, false);

  // 用户没手动选过时，跟随系统变化
  var onSystemChange = function (e) {
    var s = stored();
    if (s === "dark" || s === "light") return;   // 用户已明确选择，不跟随
    apply(e.matches ? "dark" : "light", false);
  };
  if (mq.addEventListener) mq.addEventListener("change", onSystemChange);
  else if (mq.addListener) mq.addListener(onSystemChange);

  /* —— 绑定切换按钮（DOM 就绪后）—— */
  function bind() {
    var btn = document.getElementById("themeToggle");
    if (!btn) return;
    var label = function () {
      var isDark = root.getAttribute("data-theme") === "dark";
      btn.setAttribute("aria-label", isDark ? "切换到浅色主题" : "切换到深色主题");
      btn.setAttribute("title", isDark ? "切换到浅色主题" : "切换到深色主题");
    };
    label();

    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      apply(next, true);
      label();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }
})();

</script>

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }
  function get(id){ return document.getElementById(id); }

  /* 从 ?id=xxx 定位项目 */
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var idx = -1;
  for(var i=0;i<WORKS.length;i++){ if(WORKS[i].id === id){ idx = i; break; } }
  // 没带 id 或 id 无效 → 回首页作品区
  if(idx < 0){ window.location.replace("index.html#work"); return; }

  var w = WORKS[idx];
  document.title = w.title + " · 汤";

  get("dCat").textContent = w.catLabel + " · " + w.year;
  get("dTitle").textContent = w.title;
  get("dRepo").textContent = "github.com/uahz/" + w.repo;
  get("dLead").textContent = w.desc;
  get("dDesc").textContent = w.desc;

  var img = get("dImg");
  img.src = COVERS[w.cover];
  img.alt = w.title + " 项目大图";
  img.width = 800; img.height = 600;

  var pts = get("dPoints");
  w.highlights.forEach(function(t){ pts.appendChild(el("li", null, t)); });

  var techs = get("dTechs");
  w.tech.forEach(function(t){ techs.appendChild(el("span","tech", t)); });

  /* 链接：在线体验（若有）+ 仓库源码，均为外链 */
  var links = get("dLinks");
  function addLink(href, label, primary){
    var a = el("a", "detail__link" + (primary ? " detail__link--primary" : ""));
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.appendChild(el("span", null, label));
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    var attrs = ["width","height","viewBox","fill","stroke","stroke-width","stroke-linecap","stroke-linejoin","aria-hidden"];
    var vals = ["15","15","0 0 24 24","none","currentColor","2","round","round","true"];
    attrs.forEach(function(k,i2){ svg.setAttribute(k, vals[i2]); });
    var p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", primary ? "M7 17 17 7M9 7h8v8" : "M5 12h14M13 6l6 6-6 6");
    svg.appendChild(p);
    a.appendChild(svg);
    links.appendChild(a);
  }
  var isSite = w.demo && w.demo.indexOf("github.com/") === -1;
  if(isSite) addLink(w.demo, w.demoLabel, true);
  addLink(w.repoUrl, "仓库源码", !isSite);

  /* 信息表 */
  var meta = get("dMeta");
  [
    ["分类", w.catLabel],
    ["年份", w.year],
    ["技术栈", w.tech.length + " 项"],
    ["在线体验", isSite ? "有" : "—"],
  ].forEach(function(pair){
    var row = el("div","about__fact");
    row.appendChild(el("dt", null, pair[0]));
    row.appendChild(el("dd", null, pair[1]));
    meta.appendChild(row);
  });

  /* 上 / 下一个项目 */
  var nav = get("dNav");
  function navItem(step, label, cls){
    var j = idx + step;
    if(j < 0 || j >= WORKS.length) return;
    var a = el("a", cls || "");
    a.href = "project.html?id=" + encodeURIComponent(WORKS[j].id);
    a.appendChild(el("span", null, label));
    a.appendChild(el("b", null, WORKS[j].title));
    nav.appendChild(a);
  }
  navItem(-1, "上一个");
  navItem(1, "下一个", "is-next");

  /* 导航滚动态 + 汉堡 */
  var navEl = get("nav");
  var navToggle = get("navToggle");
  var navMenu = get("navMenu");
  function onScroll(){ navEl.classList.toggle("is-stuck", window.scrollY > 8); }
  onScroll();
  window.addEventListener("scroll", onScroll, {passive:true});
  if(navToggle && navMenu){
    navToggle.addEventListener("click", function(){
      var open = navToggle.getAttribute("aria-expanded") === "true";
      navToggle.setAttribute("aria-expanded", String(!open));
      navMenu.classList.toggle("is-open", !open);
    });
    navMenu.addEventListener("click", function(e){
      if(e.target.closest("a")){
        navToggle.setAttribute("aria-expanded","false");
        navMenu.classList.remove("is-open");
      }
    });
  }

  /* 入场动效（与主页同一套） */
  var revealEls = Array.prototype.slice.call(
    document.querySelectorAll(".detail__head, .detail__hero, .detail__grid > *, .detail__nav"));
  // 按阅读顺序错峰：标题 → 大图 → 正文/侧栏 → 上下项目
  revealEls.forEach(function(e, i){
    e.classList.add("reveal");
    e.style.setProperty("--delay", Math.min(i, 3) * 70 + "ms");
  });
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        entry.target.classList.add("is-in");
        io.unobserve(entry.target);
      });
    }, {threshold:0.08, rootMargin:"0px 0px -40px 0px"});
    revealEls.forEach(function(e){ io.observe(e); });
  }else{
    revealEls.forEach(function(e){ e.classList.add("is-in"); });
  }

  get("year").textContent = String(new Date().getFullYear());
})();
