<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>项目详情 · 汤</title>
<meta name="description" content="项目详情 —— 完整介绍、实现要点、技术栈与访问链接。">
<meta name="theme-color" content="#FAFAFA">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23165DFF%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2732%27%20r%3D%277%27%20fill%3D%27%23FFFFFF%27%2F%3E%3C%2Fsvg%3E">
<style>
/* ══════════════════════════════════════════════════════════════
   设计系统
   所有色值、圆角、阴影、间距一律走 CSS 变量，禁止零散写色。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* —— 品牌色 —— */
  --c-primary:#165DFF;
  --c-primary-hover:#0E4AD8;
  --c-primary-soft:rgba(22,93,255,.08);
  --c-primary-line:rgba(22,93,255,.22);

  /* —— 中性色 —— */
  --c-bg:#FAFAFA;
  --c-surface:#FFFFFF;
  --c-text:#1D1D1F;
  --c-text-2:#86868B;
  --c-text-3:#AEAEB2;
  --c-line:rgba(29,29,31,.10);
  --c-line-soft:rgba(29,29,31,.06);
  --c-on-primary:#FFFFFF;   /* 主色之上的文字色 */

  /* —— 阴影：低透明度、柔和，拒绝厚重黑影 —— */
  --sh-1:0 1px 2px rgba(29,29,31,.04), 0 4px 14px rgba(29,29,31,.045);
  --sh-2:0 2px 6px rgba(29,29,31,.05), 0 14px 40px rgba(29,29,31,.075);
  --sh-3:0 8px 24px rgba(29,29,31,.09), 0 32px 72px rgba(29,29,31,.13);

  /* —— 圆角：统一 12px —— */
  --r-sm:8px;
  --r:12px;
  --r-lg:20px;
  --r-pill:999px;

  /* —— 字体：标题用 Sora（几何感、有辨识度），正文用 Noto Sans SC —— */
  --font-display:"Sora","SF Pro Display","Helvetica Neue",-apple-system,
                 "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","SF Pro Text","PingFang SC","Microsoft YaHei",
              -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;

  /* —— 字号阶梯：层级严格区分 —— */
  --fs-xs:.75rem;      /* 12 */
  --fs-sm:.8125rem;    /* 13 */
  --fs-base:.9375rem;  /* 15 */
  --fs-md:1.0625rem;   /* 17 */
  --fs-lg:1.25rem;     /* 20 */
  --fs-xl:1.75rem;     /* 28 */
  --fs-2xl:2.5rem;     /* 40 */
  --fs-3xl:clamp(2.6rem,5.6vw,4.25rem); /* 42–68 */

  /* —— 间距 —— */
  --sp-1:.5rem; --sp-2:1rem; --sp-3:1.5rem; --sp-4:2rem;
  --sp-5:3rem; --sp-6:4rem; --sp-7:6rem; --sp-8:8rem;

  --gutter:1.5rem;
  --maxw:1240px;
  --nav-h:64px;

  /* —— 动效 —— */
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:.22s;
  --t-mid:.42s;
  --t-slow:.66s;
}

/* ══════════ 基础 ══════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font-body);
  font-size:var(--fs-base);
  line-height:1.7;
  color:var(--c-text);
  background:var(--c-bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
/* 极淡径向渐变：营造空间深度，肉眼几乎不可见 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1200px 680px at 78% -10%,rgba(22,93,255,.035),transparent 62%),
    radial-gradient(900px 560px at 4% 24%,rgba(29,29,31,.022),transparent 60%),
    radial-gradient(1000px 620px at 50% 108%,rgba(22,93,255,.022),transparent 64%);
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  margin:0;font-weight:600;line-height:1.14;
  letter-spacing:-.025em;color:var(--c-text);
}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--c-primary);outline-offset:3px;border-radius:4px}
::selection{background:var(--c-primary);color:var(--c-on-primary)}

.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.skip{
  position:fixed;left:var(--sp-3);top:-80px;z-index:200;
  padding:.65rem 1.1rem;border-radius:var(--r-sm);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:600;font-size:var(--fs-sm);
  transition:top .2s var(--ease);
}
.skip:focus{top:var(--sp-3)}

/* ══════════ 1. 固定导航栏 ══════════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--nav-h);
  display:flex;align-items:center;
  background:rgba(250,250,250,0);
  border-bottom:1px solid transparent;
  transition:background .4s var(--ease),border-color .4s var(--ease),
             backdrop-filter .4s var(--ease),box-shadow .4s var(--ease);
}
.nav.is-stuck{
  background:rgba(250,250,250,.72);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  backdrop-filter:saturate(180%) blur(18px);
  border-bottom-color:var(--c-line-soft);
  box-shadow:0 1px 0 rgba(29,29,31,.02);
}
.nav__inner{display:flex;align-items:center;justify-content:space-between;width:100%}
.brand{
  display:flex;align-items:center;gap:.6rem;
  font-family:var(--font-display);font-size:1.0625rem;font-weight:600;
  letter-spacing:-.02em;color:var(--c-text);
}
.brand__dot{
  width:7px;height:7px;border-radius:50%;background:var(--c-primary);
  transition:transform .4s var(--ease-out);
}
.brand:hover .brand__dot{transform:scale(1.6)}
.nav__menu{display:flex;align-items:center;gap:.35rem}
.nav__link{
  position:relative;padding:.5rem .8rem;border-radius:var(--r-sm);
  font-size:var(--fs-sm);font-weight:500;color:var(--c-text-2);
  transition:color .24s var(--ease),background .24s var(--ease);
}
.nav__link:hover{color:var(--c-text);background:rgba(29,29,31,.035)}
.nav__link.is-active{color:var(--c-text)}
.nav__link.is-active::after{
  content:"";position:absolute;left:.8rem;right:.8rem;bottom:.15rem;
  height:1.5px;border-radius:2px;background:var(--c-primary);
}
.nav__toggle{
  display:none;width:40px;height:40px;border-radius:var(--r-sm);
  align-items:center;justify-content:center;flex-direction:column;gap:5px;
}
.nav__toggle span{
  display:block;width:19px;height:1.5px;border-radius:2px;background:var(--c-text);
  transition:transform .3s var(--ease),opacity .2s var(--ease);
}
.nav__toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav__toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
.nav__toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

/* ══════════ 通用：板块标题 ══════════ */
.section{padding:var(--sp-8) 0;position:relative}
.section__head{margin-bottom:var(--sp-5);max-width:44rem}
.eyebrow{
  display:inline-flex;align-items:center;gap:.55rem;
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.18em;text-transform:uppercase;color:var(--c-primary);
  margin-bottom:var(--sp-2);
}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor;opacity:.55}
.section__title{font-size:var(--fs-2xl)}
.section__desc{margin-top:var(--sp-3);color:var(--c-text-2);font-size:var(--fs-md);line-height:1.75}
.section__num{
  font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--c-text-3);
  letter-spacing:.1em;
}

/* ══════════ 2. Hero ══════════ */
.hero{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--sp-4);
  align-items:end;
  padding-top:calc(var(--nav-h) + var(--sp-8));
  padding-bottom:var(--sp-7);
  min-height:calc(100vh - var(--nav-h));
  min-height:calc(100svh - var(--nav-h));
}
.hero__left{grid-column:1/8}
.hero__right{grid-column:9/13;padding-top:var(--sp-6);display:flex;flex-direction:column;justify-content:flex-end;gap:var(--sp-4)}
.hero__eyebrow{
  display:inline-flex;align-items:center;gap:.6rem;
  padding:.34rem .8rem;border-radius:var(--r-pill);
  background:var(--c-primary-soft);border:1px solid var(--c-primary-line);
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.12em;text-transform:uppercase;color:var(--c-primary);
  margin-bottom:var(--sp-3);
}
.hero__eyebrow i{
  width:6px;height:6px;border-radius:50%;background:var(--c-primary);
  animation:pulse 2.4s var(--ease) infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(22,93,255,.34)}
  50%{box-shadow:0 0 0 7px rgba(22,93,255,0)}
}
.hero__title{font-size:var(--fs-3xl);letter-spacing:-.035em}
.hero__title em{font-style:normal;color:var(--c-primary)}
.hero__role{
  margin-top:var(--sp-3);font-size:var(--fs-lg);
  color:var(--c-text);font-weight:500;letter-spacing:-.01em;
}
.hero__desc{
  margin-top:var(--sp-3);font-size:var(--fs-md);color:var(--c-text-2);
  max-width:34rem;line-height:1.8;
}
.hero__cta{display:flex;flex-wrap:wrap;gap:.85rem;justify-content:flex-end}
.hero__stats{
  grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--sp-5);
  margin-top:var(--sp-6);padding-top:var(--sp-4);
  border-top:1px solid var(--c-line-soft);
}
.hero__stat{display:grid;gap:.1rem}
.hero__stat b{
  font-family:var(--font-display);font-size:var(--fs-xl);
  font-weight:600;letter-spacing:-.02em;
}
.hero__stat span{font-size:var(--fs-xs);color:var(--c-text-2);letter-spacing:.02em}

/* Hero 右侧：一条当前动态，克制的小段落 */
.hero__note{
  padding:var(--sp-3) 0 var(--sp-3) var(--sp-3);
  border-left:2px solid var(--c-primary-line);
}
.hero__note-label{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-3);
  margin-bottom:.7rem;
}
.hero__note-text{font-size:var(--fs-base);color:var(--c-text);line-height:1.75}
.hero__note-meta{
  margin-top:.8rem;font-family:var(--font-mono);font-size:var(--fs-xs);
  color:var(--c-primary);letter-spacing:.04em;
}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;gap:.55rem;
  padding:.82rem 1.5rem;border-radius:var(--r-pill);
  font-size:var(--fs-base);font-weight:600;letter-spacing:-.005em;
  transition:transform .3s var(--ease-out),box-shadow .3s var(--ease),
             background .3s var(--ease),border-color .3s var(--ease);
}
.btn--primary{background:var(--c-primary);color:var(--c-on-primary);box-shadow:0 4px 18px rgba(22,93,255,.22)}
.btn--primary:hover{background:var(--c-primary-hover);transform:translateY(-2px);box-shadow:0 10px 30px rgba(22,93,255,.30)}
.btn--ghost{border:1px solid var(--c-line);color:var(--c-text);background:var(--c-surface)}
.btn--ghost:hover{border-color:var(--c-primary);color:var(--c-primary);transform:translateY(-2px)}
.btn svg{transition:transform .3s var(--ease-out)}
.btn:hover svg{transform:translateX(3px)}

/* ══════════ 3. 作品画廊（Bento 错落网格）══════════ */
.gallery{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--sp-4);
}
.card{
  position:relative;display:flex;flex-direction:column;
  background:var(--c-surface);
  border:1px solid var(--c-line-soft);
  border-radius:var(--r);
  overflow:hidden;cursor:pointer;
  text-align:left;width:100%;
  transition:transform .42s var(--ease-out),box-shadow .42s var(--ease),
             border-color .42s var(--ease);
}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:var(--c-line)}
.card:focus-visible{outline:2px solid var(--c-primary);outline-offset:3px}
.card__media{
  position:relative;aspect-ratio:4/3;overflow:hidden;
  background:var(--c-surface);
  border-bottom:1px solid var(--c-line-soft);
}
.card__media img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .68s var(--ease-out);
}
.card:hover .card__media img{transform:scale(1.06)}
.card__badge{
  position:absolute;top:.85rem;left:.85rem;
  padding:.24rem .6rem;border-radius:var(--r-pill);
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--c-line-soft);
  font-family:var(--font-mono);font-size:var(--fs-xs);
  color:var(--c-text-2);letter-spacing:.06em;
}
.card__body{padding:1.15rem 1.25rem 1.3rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.card__title{font-size:var(--fs-lg);letter-spacing:-.018em}
.card__cat{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.12em;text-transform:uppercase;color:var(--c-primary);
}
.card__desc{font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.65}
.card__foot{
  margin-top:auto;padding-top:.85rem;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  font-size:var(--fs-xs);color:var(--c-text-3);
}
.card__more{
  display:inline-flex;align-items:center;gap:.3rem;
  color:var(--c-text-2);font-weight:600;
  transition:color .26s var(--ease),gap .26s var(--ease);
}
.card:hover .card__more{color:var(--c-primary);gap:.55rem}

/* Bento 桌面规则见文件末尾 @media (min-width:1024px) */


/* ══════════ 5. 技能与工具 ══════════ */
.skills{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-6);align-items:start}
.skill-group{margin-bottom:var(--sp-4)}
.skill-group:last-child{margin-bottom:0}
.skill-group__name{
  font-size:var(--fs-sm);font-weight:600;color:var(--c-text);
  margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem;
}
.skill-group__name::before{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--c-primary);
}
.skill-tags{display:flex;flex-wrap:wrap;gap:.5rem}
.skill-tag{
  padding:.38rem .85rem;border-radius:var(--r-pill);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);color:var(--c-text);
  transition:border-color .26s var(--ease),color .26s var(--ease),
             transform .26s var(--ease-out);
}
.skill-tag:hover{border-color:var(--c-primary-line);color:var(--c-primary);transform:translateY(-2px)}
.tools{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:.75rem;
}
.tool{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  padding:1.05rem .5rem;border-radius:var(--r);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  color:var(--c-text-2);
  transition:border-color .26s var(--ease),color .26s var(--ease),
             transform .26s var(--ease-out),box-shadow .26s var(--ease);
}
.tool:hover{
  border-color:var(--c-primary-line);color:var(--c-primary);
  transform:translateY(-3px);box-shadow:var(--sh-1);
}
.tool svg{width:24px;height:24px}
.tool span{font-size:var(--fs-xs);letter-spacing:.01em}

/* ══════════ 6. 关于我 ══════════ */
.about{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--sp-6);align-items:center}
.about__text p{color:var(--c-text-2);font-size:var(--fs-md);line-height:1.85}
.about__text p + p{margin-top:var(--sp-3)}
.about__text strong{color:var(--c-text);font-weight:600}
.about__quote{
  margin-top:var(--sp-4);padding-left:var(--sp-3);
  border-left:2px solid var(--c-primary);
  font-family:var(--font-display);font-size:var(--fs-lg);
  line-height:1.55;letter-spacing:-.015em;color:var(--c-text);
}
.about__facts{
  margin-top:var(--sp-4);display:grid;gap:0;
  border-top:1px solid var(--c-line-soft);
}
.about__fact{
  display:flex;justify-content:space-between;gap:var(--sp-3);
  padding:.85rem 0;border-bottom:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);
}
.about__fact dt{color:var(--c-text-2)}
.about__fact dd{margin:0;font-weight:600;text-align:right}
.about__media{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  aspect-ratio:4/5;background:var(--c-surface);
  border:1px solid var(--c-line-soft);box-shadow:var(--sh-1);
}
.about__media img{width:100%;height:100%;object-fit:cover}

/* ══════════ 7. 联系 ══════════ */
.contact{
  display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-6);
  align-items:center;
}
.contact__lead{font-size:var(--fs-2xl);letter-spacing:-.03em;line-height:1.2}
.contact__mail{
  display:inline-flex;align-items:center;gap:.6rem;margin-top:var(--sp-4);
  font-family:var(--font-display);font-size:var(--fs-lg);font-weight:600;
  letter-spacing:-.02em;
  border-bottom:1.5px solid var(--c-primary-line);
  padding-bottom:.2rem;
  transition:border-color .28s var(--ease),color .28s var(--ease);
}
.contact__mail:hover{color:var(--c-primary);border-color:var(--c-primary)}
.socials{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:var(--sp-5)}
.social{
  display:inline-flex;align-items:center;gap:.55rem;
  padding:.6rem 1.05rem;border-radius:var(--r-pill);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
  font-size:var(--fs-sm);font-weight:500;color:var(--c-text);
  transition:all .26s var(--ease);
}
.social:hover{
  border-color:var(--c-primary);color:var(--c-primary);
  transform:translateY(-2px);box-shadow:var(--sh-1);
}
.social svg{width:17px;height:17px;flex:none}

/* 联系区右栏：合作方式清单 */
.contact__note{
  padding:var(--sp-4);border-radius:var(--r);
  background:var(--c-surface);border:1px solid var(--c-line-soft);
}
.contact__note-label{
  font-family:var(--font-mono);font-size:var(--fs-xs);
  letter-spacing:.16em;text-transform:uppercase;color:var(--c-text-3);
  margin-bottom:1rem;
}
.contact__note-list{display:grid;gap:.85rem}
.contact__note-list li{
  position:relative;padding-left:1.15rem;
  font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.6;
}
.contact__note-list li::before{
  content:"";position:absolute;left:0;top:.62em;
  width:5px;height:5px;border-radius:50%;background:var(--c-primary);opacity:.65;
}

/* ══════════ 8. 页脚 ══════════ */
.footer{
  border-top:1px solid var(--c-line-soft);
  padding:var(--sp-4) 0;
}
.footer__inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-3);flex-wrap:wrap;
  font-size:var(--fs-sm);color:var(--c-text-2);
}
.footer__links{display:flex;gap:var(--sp-3);flex-wrap:wrap}
.footer__links a{transition:color .24s var(--ease)}
.footer__links a:hover{color:var(--c-primary)}

  var pts = get("dPoints");
  w.highlights.forEach(function(t){ pts.appendChild(el("li", null, t)); });

  var techs = get("dTechs");
  w.tech.forEach(function(t){ techs.appendChild(el("span","tech", t)); });

  /* 链接：在线体验（若有）+ 仓库源码，均为外链 */
  var links = get("dLinks");
  function addLink(href, label, primary){
    var a = el("a", "detail__link" + (primary ? " detail__link--primary" : ""));
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.appendChild(el("span", null, label));
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    var attrs = ["width","height","viewBox","fill","stroke","stroke-width","stroke-linecap","stroke-linejoin","aria-hidden"];
    var vals = ["15","15","0 0 24 24","none","currentColor","2","round","round","true"];
    attrs.forEach(function(k,i2){ svg.setAttribute(k, vals[i2]); });
    var p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d", primary ? "M7 17 17 7M9 7h8v8" : "M5 12h14M13 6l6 6-6 6");
    svg.appendChild(p);
    a.appendChild(svg);
    links.appendChild(a);
  }
  var isSite = w.demo && w.demo.indexOf("github.com/") === -1;
  if(isSite) addLink(w.demo, w.demoLabel, true);
  addLink(w.repoUrl, "仓库源码", !isSite);

  /* 信息表 */
  var meta = get("dMeta");
  [
    ["分类", w.catLabel],
    ["年份", w.year],
    ["技术栈", w.tech.length + " 项"],
    ["在线体验", isSite ? "有" : "—"],
  ].forEach(function(pair){
    var row = el("div","about__fact");
    row.appendChild(el("dt", null, pair[0]));
    row.appendChild(el("dd", null, pair[1]));
    meta.appendChild(row);
  });

  /* 上 / 下一个项目 */
  var nav = get("dNav");
  function navItem(step, label, cls){
    var j = idx + step;
    if(j < 0 || j >= WORKS.length) return;
    var a = el("a", cls || "");
    a.href = "project.html?id=" + encodeURIComponent(WORKS[j].id);
    a.appendChild(el("span", null, label));
    a.appendChild(el("b", null, WORKS[j].title));
    nav.appendChild(a);
  }
  navItem(-1, "上一个");
  navItem(1, "下一个", "is-next");

  /* 导航滚动态 + 汉堡 */
  var navEl = get("nav");
  var navToggle = get("navToggle");
  var navMenu = get("navMenu");
  function onScroll(){ navEl.classList.toggle("is-stuck", window.scrollY > 8); }
  onScroll();
  window.addEventListener("scroll", onScroll, {passive:true});
  if(navToggle && navMenu){
    navToggle.addEventListener("click", function(){
      var open = navToggle.getAttribute("aria-expanded") === "true";
      navToggle.setAttribute("aria-expanded", String(!open));
      navMenu.classList.toggle("is-open", !open);
    });
    navMenu.addEventListener("click", function(e){
      if(e.target.closest("a")){
        navToggle.setAttribute("aria-expanded","false");
        navMenu.classList.remove("is-open");
      }
    });
  }

  /* 入场动效（与主页同一套） */
  var revealEls = Array.prototype.slice.call(
    document.querySelectorAll(".detail__head, .detail__hero, .detail__grid > *, .detail__nav"));
  revealEls.forEach(function(e, i){
    e.classList.add("reveal");
    e.style.setProperty("--delay", (i % 4) * 90 + "ms");
  });
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        entry.target.classList.add("is-in");
        io.unobserve(entry.target);
      });
    }, {threshold:0.08, rootMargin:"0px 0px -40px 0px"});
    revealEls.forEach(function(e){ io.observe(e); });
  }else{
    revealEls.forEach(function(e){ e.classList.add("is-in"); });
  }

  get("year").textContent = String(new Date().getFullYear());
})();
</script>
</body>
</html>
